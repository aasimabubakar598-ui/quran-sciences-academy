
<!DOCTYPE html>
<html lang="ar" dir="rtl"
  data-title-ar="تسجيل الدخول | أكاديمية القرآن الكريم"
  data-title-en="Login | Quran Sciences Academy">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f2a24">
  <meta name="description" content="تسجيل الدخول إلى أكاديمية القرآن الكريم وعلومه">

  <title>تسجيل الدخول | أكاديمية القرآن الكريم</title>

  <link rel="stylesheet" href="/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/app.js" defer></script>

  <style>
    .auth-page {
      min-height: 75vh;
      padding: 45px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-container {
      width: 100%;
      max-width: 480px;
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .auth-container h1 {
      text-align: center;
      color: #0f2a24;
      margin-top: 0;
    }

    .auth-description {
      text-align: center;
      color: #64746e;
      margin-bottom: 25px;
    }

    .auth-form {
      display: grid;
      gap: 14px;
    }

    .auth-form label {
      font-weight: 700;
      color: #19362e;
    }

    .auth-form input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d8dfda;
      border-radius: 9px;
      font-family: inherit;
      font-size: 16px;
      margin-top: 6px;
    }

    .auth-form button {
      border: 0;
      border-radius: 9px;
      padding: 14px;
      background: #0f2a24;
      color: white;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-form button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .auth-switch {
      text-align: center;
      margin-top: 22px;
      color: #64746e;
    }

    .auth-switch button {
      border: 0;
      background: none;
      color: #997a35;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      font-size: inherit;
    }

    .auth-message {
      display: none;
      padding: 12px;
      margin-top: 18px;
      border-radius: 8px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .auth-message.success {
      display: block;
      background: #e8f5ec;
      color: #176438;
    }

    .auth-message.error {
      display: block;
      background: #fcebea;
      color: #a12622;
    }

    .auth-message.info {
      display: block;
      background: #edf3f5;
      color: #244b5a;
    }

    .hidden {
      display: none !important;
    }

    .auth-back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #997a35;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header class="site-header">
  <a href="/index.html" class="logo">
    <span>أكاديمية القرآن الكريم</span>
  </a>

  <button id="languageToggle" type="button">English</button>
</header>

<main class="auth-page">

  <section class="auth-container">

    <h1 data-ar="مرحباً بك في الأكاديمية"
        data-en="Welcome to the Academy">
      مرحباً بك في الأكاديمية
    </h1>

    <p class="auth-description"
       data-ar="سجّل الدخول أو أنشئ حساباً للانضمام إلى الأكاديمية."
       data-en="Log in or create an account to join the academy.">
      سجّل الدخول أو أنشئ حساباً للانضمام إلى الأكاديمية.
    </p>

    <!-- LOGIN FORM -->

    <form id="loginForm" class="auth-form">

      <h2 data-ar="تسجيل الدخول"
          data-en="Login">
        تسجيل الدخول
      </h2>

      <label>
        <span data-ar="البريد الإلكتروني"
              data-en="Email address">
          البريد الإلكتروني
        </span>

        <input
          type="email"
          id="loginEmail"
          placeholder="example@email.com"
          autocomplete="email"
          required>
      </label>

      <label>
        <span data-ar="كلمة المرور"
              data-en="Password">
          كلمة المرور
        </span>

        <input
          type="password"
          id="loginPassword"
          autocomplete="current-password"
          required>
      </label>

      <button type="submit" id="loginButton"
              data-ar="دخول"
              data-en="Log in">
        دخول
      </button>

    </form>

    <!-- REGISTRATION FORM -->

    <form id="registerForm" class="auth-form hidden">

      <h2 data-ar="إنشاء حساب طالب"
          data-en="Create Student Account">
        إنشاء حساب طالب
      </h2>

      <label>
        <span data-ar="الاسم الكامل"
              data-en="Full name">
          الاسم الكامل
        </span>

        <input
          type="text"
          id="fullName"
          autocomplete="name"
          required>
      </label>

      <label>
        <span data-ar="البريد الإلكتروني"
              data-en="Email address">
          البريد الإلكتروني
        </span>

        <input
          type="email"
          id="registerEmail"
          autocomplete="email"
          required>
      </label>

      <label>
        <span data-ar="كلمة المرور"
              data-en="Password">
          كلمة المرور
        </span>

        <input
          type="password"
          id="registerPassword"
          minlength="6"
          autocomplete="new-password"
          required>
      </label>

      <button type="submit" id="registerButton"
              data-ar="إنشاء الحساب"
              data-en="Create account">
        إنشاء الحساب
      </button>

    </form>

    <div class="auth-switch">

      <span id="switchText"
            data-ar="ليس لديك حساب؟"
            data-en="Don't have an account?">
        ليس لديك حساب؟
      </span>

      <button type="button" id="switchButton"
              data-ar="إنشاء حساب"
              data-en="Register">
        إنشاء حساب
      </button>

    </div>

    <div id="authMessage" class="auth-message"
         role="status" aria-live="polite"></div>

    <a href="/index.html" class="auth-back"
       data-ar="العودة إلى الصفحة الرئيسية"
       data-en="Back to homepage">
      العودة إلى الصفحة الرئيسية
    </a>

  </section>

</main>

<footer class="site-footer">
  <p>
    © <span id="year"></span>
    <span data-ar="أكاديمية القرآن الكريم وعلومه"
          data-en="Quran Sciences Academy">
      أكاديمية القرآن الكريم وعلومه
    </span>
  </p>
</footer>

<script>
(() => {
  const SUPABASE_URL =
    "https://ejynanimpmwkkhxjquut.supabase.co";

  const SUPABASE_PUBLIC_KEY =
    "sb_publishable_MDfn2oc-LWTXJqDtp7V7Lg__89pJGUQ";

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLIC_KEY
  );

  const loginForm = document.getElementById("loginForm");
  const registerForm = document.getElementById("registerForm");

  const switchButton = document.getElementById("switchButton");
  const switchText = document.getElementById("switchText");

  const message = document.getElementById("authMessage");

  const loginButton = document.getElementById("loginButton");
  const registerButton = document.getElementById("registerButton");

  let isRegistering = false;

  function currentLanguage() {
    return document.documentElement.lang === "en" ? "en" : "ar";
  }

  function showMessage(text, type) {
    message.textContent = text;
    message.className = "auth-message " + type;
  }

  function clearMessage() {
    message.textContent = "";
    message.className = "auth-message";
  }

  function setLoading(button, loading) {
    button.disabled = loading;

    if (button === loginButton) {
      button.textContent = loading
        ? (currentLanguage() === "ar" ? "جارٍ الدخول..." : "Logging in...")
        : (currentLanguage() === "ar" ? "دخول" : "Log in");
    }

    if (button === registerButton) {
      button.textContent = loading
        ? (currentLanguage() === "ar" ? "جارٍ إنشاء الحساب..." : "Creating account...")
        : (currentLanguage() === "ar" ? "إنشاء الحساب" : "Create account");
    }
  }

  switchButton.addEventListener("click", () => {
    isRegistering = !isRegistering;

    clearMessage();

    loginForm.classList.toggle("hidden", isRegistering);
    registerForm.classList.toggle("hidden", !isRegistering);

    const language = currentLanguage();

    switchText.textContent = isRegistering
      ? (language === "ar" ? "لديك حساب بالفعل؟" : "Already have an account?")
      : (language === "ar" ? "ليس لديك حساب؟" : "Don't have an account?");

    switchButton.textContent = isRegistering
      ? (language === "ar" ? "تسجيل الدخول" : "Log in")
      : (language === "ar" ? "إنشاء حساب" : "Register");
  });

  // STUDENT REGISTRATION

  registerForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    clearMessage();
    setLoading(registerButton, true);

    const fullName =
      document.getElementById("fullName").value.trim();

    const email =
      document.getElementById("registerEmail").value.trim();

    const password =
      document.getElementById("registerPassword").value;

    const language = currentLanguage();

    try {
      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName
          },
          emailRedirectTo:
            "https://quran-sciences-academy.aasimabubakar598.workers.dev/"
        }
      });

      if (error) throw error;

      if (data.session) {
        showMessage(
          language === "ar"
            ? "تم إنشاء حسابك بنجاح. يمكنك الآن تسجيل الدخول."
            : "Your account has been created successfully. You can now log in.",
          "success"
        );
      } else {
        showMessage(
          language === "ar"
            ? "تم إنشاء الحساب. يرجى مراجعة بريدك الإلكتروني لتأكيد الحساب قبل تسجيل الدخول."
            : "Your account has been created. Please check your email to confirm your account before logging in.",
          "success"
        );
      }

      registerForm.reset();

    } catch (error) {
      showMessage(error.message, "error");
    } finally {
      setLoading(registerButton, false);
    }
  });

  // LOGIN

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    clearMessage();
    setLoading(loginButton, true);

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const language = currentLanguage();

    try {
      const { data, error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      const user = data.user;

      const { data: profile, error: profileError } = await client
        .from("profiles")
        .select("full_name, role")
        .eq("id", user.id)
        .single();

      if (profileError) {
        throw profileError;
      }

      const roleNames = {
        student: language === "ar" ? "طالب" : "Student",
        teacher: language === "ar" ? "معلم" : "Teacher",
        admin: language === "ar" ? "مدير" : "Administrator"
      };

      const role = roleNames[profile.role] || profile.role;

      showMessage(
        language === "ar"
          ? "مرحباً " + (profile.full_name || "") +
            ". تم تسجيل الدخول بنجاح. نوع الحساب: " + role +
            ". لوحة التحكم ستكون متاحة بعد إعدادها."
          : "Welcome " + (profile.full_name || "") +
            ". Login successful. Account type: " + role +
            ". Your dashboard will be available after it is configured.",
        "success"
      );

    } catch (error) {
      showMessage(error.message, "error");
    } finally {
      setLoading(loginButton, false);
    }
  });

})();
</script>

</body>
</html>
